# Proxy reverso de DESENVOLVIMENTO: reproduz o cenário de produção em que front
# e API ficam na mesma origem.
#   http://localhost:8080/       -> Next.js   (host:3000)
#   http://localhost:8080/api/*  -> FastAPI   (host:8000), SEM o prefixo /api
# Em produção, o proxy (nginx, Caddy, Traefik, load balancer...) faz o mesmo, com HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # A barra final em proxy_pass remove o prefixo: /api/auth/login -> /auth/login
    location /api/ {
        proxy_pass http://host.docker.internal:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket do hot reload do `next dev`
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
